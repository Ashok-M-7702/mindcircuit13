---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: Pythonapp
  labels:
    app: Pythonapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: Pythonapp
  template:
    metadata:
      labels:
        app: Pythonapp
    spec:
      containers:
      - name: Pythonapp
        image: chary7702/batch13:pythonflaskapp
        ports:
        - containerPort: 8080
